<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeepFresh — 鲜牛奶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --text: #111111;
    --accent: #e2001a;
    --muted: #8a8a8a;
    --hairline: #e5e5e5;
  }
  html { background: #f4f4f4; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--hairline);
    left: calc(50% - 210px + 20px);
    z-index: 0;
  }
  .page { position: relative; z-index: 1; padding: 0 24px 120px 48px; }

  /* 顶部 */
  .topbar {
    padding: 32px 0 16px;
    border-bottom: 1px solid var(--text);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .back {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
  }
  .back:hover { color: var(--accent); }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }

  /* 天数主体 */
  .hero {
    padding: 40px 0 24px;
    border-bottom: 1px solid var(--hairline);
  }
  .hero .days {
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .hero .days small {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-left: 8px;
  }
  .hero .caption {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .status-tag {
    display: inline-block;
    margin-top: 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
  }

  /* 分组标题 */
  .group-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 32px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--text);
  }
  .group-title .no { color: var(--accent); margin-right: 8px; }

  /* 信息网格 */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-left: 1px solid var(--hairline);
    border-top: 1px solid var(--hairline);
    margin-top: 16px;
  }
  .cell {
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 12px;
  }
  .cell .k {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .cell .v {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cell .v.red { color: var(--accent); }

  /* 备注 */
  .note {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--hairline);
    font-size: 13px;
    color: #444444;
    line-height: 1.65;
  }
  .note .k {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* 进度条 */
  .progress {
    margin-top: 24px;
  }
  .progress .track {
    height: 4px;
    background: var(--hairline);
    position: relative;
  }
  .progress .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 57%;
    background: var(--accent);
  }
  .progress .labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* 底部操作 */
  .actionbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    background: var(--bg);
    border-top: 1px solid var(--text);
    padding: 16px 24px 24px 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    z-index: 10;
  }
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 14px 0;
    border-radius: 0;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .btn-edit {
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
  }
  .btn-edit:active { background: #b80015; }
  .btn-delete {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--text);
  }
  .btn-delete:active { background: var(--text); color: #ffffff; }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <a class="back" href="11-index.html">← 返回</a>
    <div class="title">鲜牛奶</div>
  </header>

  <section class="hero">
    <div class="caption">剩余保质期 / Days Left</div>
    <div class="days">3<small>DAYS</small></div>
    <span class="status-tag">临期 · Expiring</span>
  </section>

  <div class="progress">
    <div class="track"><div class="fill"></div></div>
    <div class="labels">
      <span>生产 08-20</span>
      <span>已存放 4 / 7 天</span>
      <span>到期 08-27</span>
    </div>
  </div>

  <div class="group-title"><span class="no">01</span> — 物资信息</div>
  <div class="info-grid">
    <div class="cell">
      <div class="k">分类 / Category</div>
      <div class="v">食品</div>
    </div>
    <div class="cell">
      <div class="k">规格 / Spec</div>
      <div class="v">950ml</div>
    </div>
    <div class="cell">
      <div class="k">数量 / Quantity</div>
      <div class="v">1</div>
    </div>
    <div class="cell">
      <div class="k">生产日期 / MFG</div>
      <div class="v">2026-08-20</div>
    </div>
    <div class="cell">
      <div class="k">保质期 / Shelf Life</div>
      <div class="v">7 天</div>
    </div>
    <div class="cell">
      <div class="k">到期日 / Expiry</div>
      <div class="v red">2026-08-27</div>
    </div>
  </div>

  <div class="group-title"><span class="no">02</span> — 备注</div>
  <div class="note">
    <div class="k">Note</div>
    已开封，置于冰箱冷藏室上层。开封后建议 24 小时内饮用完毕，优先消耗。
  </div>

</div>

<div class="actionbar">
  <a class="btn btn-edit" href="11-add.html">编辑</a>
  <button class="btn btn-delete" type="button">删除</button>
</div>

</body>
</html>
