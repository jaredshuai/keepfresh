<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeepFresh · Swiss Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#111111; --accent:#e2001a; --muted:#8a8a8a; --line:#e5e5e5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#f2f2f2;
    font-family:'Inter','Helvetica Neue','Neue Haas Grotesk',Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    max-width:420px;margin:0 auto;background:var(--bg);
    min-height:100vh;position:relative;
    padding:0 24px 96px 32px;
  }
  /* 左侧贯穿规则线 */
  .rule{
    position:fixed;top:0;bottom:0;width:1px;background:var(--ink);
    left:calc(50% - 210px + 14px);
  }
  @media (max-width:420px){ .rule{left:14px;} }

  header{padding:36px 0 24px;border-bottom:1px solid var(--ink);}
  .brand{
    font-size:28px;font-weight:600;letter-spacing:-0.5px;line-height:1.1;
  }
  .meta{
    margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  }
  .meta .sum{color:var(--accent);}
  .meta .total{color:var(--muted);}

  .stats{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    border-bottom:1px solid var(--line);
  }
  .stat{padding:18px 0 16px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .num{font-size:34px;font-weight:600;line-height:1;letter-spacing:-1px;}
  .stat.warn .num{color:var(--accent);}
  .stat .lbl{
    margin-top:8px;font-size:10px;font-weight:600;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);
  }

  .list{border-bottom:1px solid var(--line);}
  .item{
    display:grid;grid-template-columns:36px 1fr auto;gap:16px;align-items:center;
    padding:20px 0;border-bottom:1px solid var(--line);
    line-height:1.6;
  }
  .item:last-child{border-bottom:none;}
  .idx{
    font-size:12px;font-weight:600;color:var(--muted);letter-spacing:1px;
  }
  .name{font-size:16px;font-weight:600;letter-spacing:-0.2px;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .days{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1;text-align:right;}
  .days small{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--muted);margin-top:6px;}
  .tag{
    display:inline-block;margin-top:8px;font-size:9px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;padding:3px 6px;
  }
  .item.expired .days{color:var(--ink);}
  .item.expired .tag{background:var(--ink);color:#fff;}
  .item.expiring .days{color:var(--accent);}
  .item.expiring .tag{color:var(--accent);border:1px solid var(--accent);}
  .item.safe .days{color:var(--muted);}
  .item.safe .tag{color:var(--muted);border:1px solid var(--line);}

  nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:420px;background:var(--bg);
    border-top:1px solid var(--ink);
    display:grid;grid-template-columns:repeat(4,1fr);
  }
  nav a{
    text-decoration:none;color:var(--muted);text-align:center;
    padding:14px 0 12px;font-size:10px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;
  }
  nav a svg{display:block;margin:0 auto 6px;}
  nav a.active{color:var(--ink);}
  nav a.add{
    color:#fff;background:var(--accent);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="rule"></div>

  <header>
    <div class="brand">KeepFresh</div>
    <div class="meta">
      <span class="sum">3 临期 · 1 过期</span>
      <span class="total">共 12 项</span>
    </div>
  </header>

  <section class="stats">
    <div class="stat warn"><div class="num">3</div><div class="lbl">Expiring</div></div>
    <div class="stat"><div class="num">1</div><div class="lbl">Expired</div></div>
    <div class="stat"><div class="num">12</div><div class="lbl">Total</div></div>
  </section>

  <section class="list">
    <div class="item expired">
      <span class="idx">01</span>
      <div>
        <div class="name">酸奶</div>
        <div class="sub">食品 · 200g×6</div>
        <span class="tag">Expired</span>
      </div>
      <div class="days">-2<small>Days</small></div>
    </div>
    <div class="item expiring">
      <span class="idx">02</span>
      <div>
        <div class="name">布洛芬缓释胶囊</div>
        <div class="sub">药品 · 24 粒</div>
        <span class="tag">Expiring</span>
      </div>
      <div class="days">2<small>Days</small></div>
    </div>
    <div class="item expiring">
      <span class="idx">03</span>
      <div>
        <div class="name">鲜牛奶</div>
        <div class="sub">食品 · 950ml</div>
        <span class="tag">Expiring</span>
      </div>
      <div class="days">3<small>Days</small></div>
    </div>
    <div class="item expiring">
      <span class="idx">04</span>
      <div>
        <div class="name">鸡蛋</div>
        <div class="sub">食品 · 10 枚</div>
        <span class="tag">Expiring</span>
      </div>
      <div class="days">5<small>Days</small></div>
    </div>
    <div class="item safe">
      <span class="idx">05</span>
      <div>
        <div class="name">纯牛奶</div>
        <div class="sub">食品 · 1L</div>
        <span class="tag">Safe</span>
      </div>
      <div class="days">12<small>Days</small></div>
    </div>
    <div class="item safe">
      <span class="idx">06</span>
      <div>
        <div class="name">洗发水</div>
        <div class="sub">美妆 · 500ml</div>
        <span class="tag">Safe</span>
      </div>
      <div class="days">180<small>Days</small></div>
    </div>
  </section>

  <nav>
    <a href="#" class="active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>
      首页
    </a>
    <a href="#" class="add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      添加
    </a>
    <a href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0"/></svg>
      提醒
    </a>
    <a href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      我的
    </a>
  </nav>
</div>
</body>
</html>
