<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeepFresh — Playful Gamified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fff8e7; --ink: #2d1b69; --pink: #ff6b9d;
    --teal: #4ecdc4; --yellow: #ffd93d; --amber: #f59e0b;
    --red: #ef4444; --card: #ffffff;
  }
  html, body { background: #e6d9f2; }
  body {
    font-family: 'Nunito', sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 420px; margin: 0 auto; background: var(--bg);
    min-height: 100vh; display: flex; flex-direction: column;
    box-shadow: 0 0 60px rgba(45,27,105,.15);
    position: relative; overflow: hidden;
  }

  /* ── Doodles ──────────────────────── */
  .doodle { position: absolute; pointer-events: none; z-index: 0; }
  .doodle.star { top: 22px; right: 22px; }
  .doodle.wave { top: 132px; left: -10px; }
  .doodle.dots { top: 58px; right: 90px; }

  /* ── Header ───────────────────────── */
  header { padding: 32px 24px 0; position: relative; z-index: 1; }
  .hi {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 13px; color: var(--ink); opacity: .6;
    display: inline-block; background: var(--yellow);
    padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 40px; line-height: 1.05; letter-spacing: -.01em;
  }
  h1 span { color: var(--pink); }

  /* ── Score card ───────────────────── */
  .score {
    margin: 24px; padding: 20px; border-radius: 16px;
    background: var(--ink); color: #fff; position: relative;
    box-shadow: 0 8px 0 rgba(45,27,105,.18);
  }
  .score .label {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 12px; letter-spacing: .08em; opacity: .75;
  }
  .score-row { display: flex; gap: 12px; margin-top: 14px; }
  .chip {
    flex: 1; border-radius: 12px; padding: 10px 12px;
    background: rgba(255,255,255,.1); text-align: center;
  }
  .chip .n {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px;
  }
  .chip .t { font-size: 11px; opacity: .8; margin-top: 2px; }
  .chip.warn { background: var(--amber); }
  .chip.bad { background: var(--red); }

  /* ── List ─────────────────────────── */
  main { flex: 1; padding: 0 24px 32px; position: relative; z-index: 1; }
  .list-title {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 16px; margin: 8px 0 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .list-title::after {
    content: ""; flex: 1; height: 3px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--teal) 0 10px, transparent 10px 16px);
  }
  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: 16px; padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 0 rgba(45,27,105,.08);
  }
  .item.expired { background: #ffe9ec; box-shadow: 0 4px 0 rgba(239,68,68,.2); }
  .item.soon { background: #fff4de; box-shadow: 0 4px 0 rgba(245,158,11,.2); }
  .dot {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px;
    color: #fff;
  }
  .dot.red { background: var(--red); }
  .dot.amber { background: var(--amber); }
  .dot.teal { background: var(--teal); }
  .dot.pink { background: var(--pink); }
  .dot.yellow { background: var(--yellow); color: var(--ink); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 800; font-size: 15px; }
  .item.expired .name { text-decoration: line-through wavy var(--red); }
  .meta { font-size: 12px; color: var(--ink); opacity: .55; margin-top: 2px; }
  .right { text-align: right; }
  .days {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px;
    line-height: 1;
  }
  .days small { font-size: 10px; font-weight: 600; opacity: .6; }
  .item.expired .days { color: var(--red); }
  .item.soon .days { color: var(--amber); }
  .pill {
    display: inline-block; margin-top: 6px; font-size: 10px;
    font-weight: 800; padding: 3px 10px; border-radius: 999px;
  }
  .pill.expired { background: var(--red); color: #fff; }
  .pill.soon { background: var(--amber); color: #fff; }
  .pill.fresh { background: var(--teal); color: #fff; }

  /* ── Tab bar ──────────────────────── */
  nav {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); padding: 10px 12px 16px;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -6px 24px rgba(45,27,105,.08);
    position: sticky; bottom: 0; z-index: 2;
  }
  nav a {
    text-decoration: none; color: var(--ink); opacity: .45;
    text-align: center; font-size: 11px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 0;
  }
  nav a.active { opacity: 1; }
  nav a.active .ico { background: var(--yellow); }
  .ico {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  nav a.add { opacity: 1; margin-top: -26px; }
  nav a.add .ico {
    width: 54px; height: 54px; background: var(--pink);
    box-shadow: 0 6px 0 rgba(255,107,157,.35);
  }
  nav a.add span { color: var(--pink); opacity: 1; }
</style>
</head>
<body>
<div class="page">

  <svg class="doodle star" width="34" height="34" viewBox="0 0 34 34">
    <path d="M17 2 L20 13 L32 13 L22 20 L26 32 L17 24 L8 32 L12 20 L2 13 L14 13 Z"
      fill="none" stroke="#ff6b9d" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <svg class="doodle wave" width="120" height="24" viewBox="0 0 120 24">
    <path d="M2 12 Q12 2 22 12 T42 12 T62 12 T82 12 T102 12 T122 12"
      fill="none" stroke="#4ecdc4" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <svg class="doodle dots" width="60" height="20" viewBox="0 0 60 20">
    <circle cx="6" cy="10" r="3" fill="#ffd93d"/>
    <circle cx="22" cy="10" r="3" fill="#ff6b9d"/>
    <circle cx="38" cy="10" r="3" fill="#4ecdc4"/>
    <circle cx="54" cy="10" r="3" fill="#2d1b69"/>
  </svg>

  <header>
    <span class="hi">早安，今天也来巡查冰箱吧</span>
    <h1>Keep<span>Fresh</span></h1>
  </header>

  <div class="score">
    <div class="label">本 周 保 鲜 战 报</div>
    <div class="score-row">
      <div class="chip warn"><div class="n">3</div><div class="t">临期</div></div>
      <div class="chip bad"><div class="n">1</div><div class="t">已过期</div></div>
      <div class="chip"><div class="n">12</div><div class="t">总库存</div></div>
    </div>
  </div>

  <main>
    <div class="list-title">到期倒计时</div>

    <div class="item expired">
      <div class="dot red">!</div>
      <div class="info">
        <div class="name">酸奶</div>
        <div class="meta">食品 · 200g×6</div>
      </div>
      <div class="right">
        <div class="days">−2<small> 天</small></div>
        <span class="pill expired">已过期</span>
      </div>
    </div>

    <div class="item soon">
      <div class="dot amber">2</div>
      <div class="info">
        <div class="name">布洛芬缓释胶囊</div>
        <div class="meta">药品 · 24 粒</div>
      </div>
      <div class="right">
        <div class="days">2<small> 天</small></div>
        <span class="pill soon">临期</span>
      </div>
    </div>

    <div class="item soon">
      <div class="dot amber">3</div>
      <div class="info">
        <div class="name">鲜牛奶</div>
        <div class="meta">食品 · 950ml</div>
      </div>
      <div class="right">
        <div class="days">3<small> 天</small></div>
        <span class="pill soon">临期</span>
      </div>
    </div>

    <div class="item soon">
      <div class="dot yellow">5</div>
      <div class="info">
        <div class="name">鸡蛋</div>
        <div class="meta">食品 · 10 枚</div>
      </div>
      <div class="right">
        <div class="days">5<small> 天</small></div>
        <span class="pill soon">临期</span>
      </div>
    </div>

    <div class="item">
      <div class="dot teal">12</div>
      <div class="info">
        <div class="name">纯牛奶</div>
        <div class="meta">食品 · 1L</div>
      </div>
      <div class="right">
        <div class="days">12<small> 天</small></div>
        <span class="pill fresh">新鲜</span>
      </div>
    </div>

    <div class="item">
      <div class="dot pink">180</div>
      <div class="info">
        <div class="name">洗发水</div>
        <div class="meta">美妆 · 500ml</div>
      </div>
      <div class="right">
        <div class="days">180<small> 天</small></div>
        <span class="pill fresh">新鲜</span>
      </div>
    </div>
  </main>

  <nav>
    <a href="#" class="active">
      <div class="ico">
        <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="14" height="14" rx="4" fill="#2d1b69"/></svg>
      </div>
      首页
    </a>
    <a href="#" class="add">
      <div class="ico">
        <svg width="22" height="22" viewBox="0 0 22 22"><rect x="9" y="3" width="4" height="16" rx="2" fill="#fff"/><rect x="3" y="9" width="16" height="4" rx="2" fill="#fff"/></svg>
      </div>
      <span>添加</span>
    </a>
    <a href="#">
      <div class="ico">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="#2d1b69" stroke-width="2.5"/><circle cx="9" cy="9" r="2.5" fill="#2d1b69"/></svg>
      </div>
      提醒
    </a>
    <a href="#">
      <div class="ico">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="6" r="3.5" fill="#2d1b69"/><path d="M2 17 Q9 10 16 17 Z" fill="#2d1b69"/></svg>
      </div>
      我的
    </a>
  </nav>

</div>
</body>
</html>
